name: Build and Deploy (charging-demand)

# charging-demand 모델(demand_ca_model.joblib, 532KB)은 rul-diagnosis와 달리 이미
# 저장소에 그대로 커밋돼 있다(용량 문제 없음) - S3에서 받아오는 단계가 필요 없다.

on:
  push:
    branches: [main]
    paths:
      - "ai-services/charging-demand/**"
      - ".github/workflows/deploy-charging-demand.yml"
  workflow_dispatch:

env:
  IMAGE: qp4534/ev-charging-demand
  SERVICE_DIR: ai-services/charging-demand

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: qp4534
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: qp4534/EV-energy-management-gitops
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Update image tag in gitops repo
        run: |
          sed -i "s#image: ${{ env.IMAGE }}:.*#image: ${{ env.IMAGE }}:${{ github.sha }}#" \
            gitops/apps/charging-demand/deployment.yaml
          cd gitops
          git config user.name "charging-demand-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "charging-demand image -> ${{ github.sha }}" || echo "no changes"
          git push
