name: Build and Deploy FastAPI (EKS)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: qp4534/ev-energy-management-fastapi
  GITOPS_REPOSITORY: qp4534/EV-energy-management-gitops
  EKS_CLUSTER: ev-mgmt-eks
  AWS_REGION: ap-northeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: qp4534
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ev_ai_inference_api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Create FastAPI runtime secrets in EKS
        env:
          FASTAPI_DATABASE_URL: ${{ secrets.FASTAPI_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          kubectl create namespace fastapi --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic fastapi-secret -n fastapi \
            --from-literal=DATABASE_URL="$FASTAPI_DATABASE_URL" \
            --from-literal=DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic aws-credentials -n fastapi \
            --from-literal=AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run FastAPI database migrations
        run: |
          MIGRATION_JOB="fastapi-migrate-${GITHUB_SHA::8}"
          sed \
            -e "s#REPLACE_WITH_JOB_NAME#$MIGRATION_JOB#g" \
            -e "s#REPLACE_WITH_IMAGE_URI#${{ env.IMAGE }}:${{ github.sha }}#g" \
            ev_ai_inference_api/k8s/migration-job.yaml | kubectl apply -f -
          for attempt in $(seq 1 180); do
            if ! kubectl get job "$MIGRATION_JOB" -n fastapi >/dev/null 2>&1; then
              echo 'Migration job disappeared before completion.'
              exit 1
            fi
            succeeded=$(kubectl get job "$MIGRATION_JOB" -n fastapi -o jsonpath='{.status.succeeded}')
            failed=$(kubectl get job "$MIGRATION_JOB" -n fastapi -o jsonpath='{.status.failed}')
            if [ "$succeeded" = '1' ]; then
              kubectl logs job/"$MIGRATION_JOB" -n fastapi || true
              kubectl delete job "$MIGRATION_JOB" -n fastapi --ignore-not-found=true
              exit 0
            fi
            if [ -n "$failed" ] && [ "$failed" -gt 0 ]; then
              echo 'FastAPI database migration failed.'
              kubectl logs job/"$MIGRATION_JOB" -n fastapi || true
              kubectl describe job "$MIGRATION_JOB" -n fastapi || true
              exit 1
            fi
            sleep 5
          done
          echo 'Timed out waiting for FastAPI database migration.'
          exit 1

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: gitops

      - name: Update FastAPI image tag in GitOps (EKS)
        run: |
          python ev_ai_inference_api/scripts/update_gitops_fastapi_deployment.py \
            --path gitops/apps/fastapi-eks/deployment.yaml \
            --image "${{ env.IMAGE }}:${{ github.sha }}"
          sed -i "s#image: ${{ env.IMAGE }}:.*#image: ${{ env.IMAGE }}:${{ github.sha }}#" gitops/apps/fastapi-eks/scenario-replay.yaml
          cd gitops
          git config user.name "fastapi-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "fastapi image -> ${{ github.sha }}" || echo "no changes"
          git push

      - name: Register FastAPI application in Argo CD (EKS)
        run: |
          kubectl apply -f "https://raw.githubusercontent.com/${{ env.GITOPS_REPOSITORY }}/main/argocd/fastapi-eks-application.yaml"

      - name: Verify FastAPI rollout
        run: |
          set -eu
          kubectl rollout status deployment/ev-ai-inference-api -n fastapi --timeout=180s
          kubectl rollout status deployment/ev-scenario-replay -n fastapi --timeout=180s
          kubectl get deployment,pods,svc,endpoints -n fastapi -o wide

      - name: Smoke test FastAPI sample path
        run: |
          SMOKE_SCRIPT_B64="$(base64 -w0 <<'PY'
          import json
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from uuid import uuid4

          vehicle_id = str(uuid4())
          payload = {
              "schema_version": 1,
              "layout_id": "generic_ev_concept_96_v1",
              "session_id": str(uuid4()),
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "sequence": 1,
              "temperature_decic": [300] * 96,
              "voltage_mv": [3600] * 96,
              "connector_temperature_decic": [300, 300, 300],
              "ambient_temperature_c": 25.0,
              "pack_current_a": 20.0,
          }
          request = urllib.request.Request(
              f"http://127.0.0.1:8000/api/v1/twins/vehicles/{vehicle_id}/samples",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"FastAPI sample-path smoke failed: HTTP {exc.code}: {body}"
              ) from exc
          if (
              result["final_risk_level"] != 0
              or result.get("anomaly_id") is not None
              or result.get("twin_ai_status") != "ready"
          ):
              raise RuntimeError(f"unexpected smoke response: {result}")
          print("FastAPI sample-path smoke test passed")
          PY
          )"
          pod=$(kubectl get pod -n fastapi -l app=ev-ai-inference-api -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n fastapi "$pod" -- sh -c "printf '%s' '$SMOKE_SCRIPT_B64' | base64 -d | python -"

      - name: Smoke test FastAPI service from backend namespace
        run: |
          SMOKE_SCRIPT_B64="$(base64 -w0 <<'PY'
          import json
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from uuid import uuid4

          vehicle_id = str(uuid4())
          payload = {
              "schema_version": 1,
              "layout_id": "generic_ev_concept_96_v1",
              "session_id": str(uuid4()),
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "sequence": 1,
              "temperature_decic": [300] * 96,
              "voltage_mv": [3600] * 96,
              "connector_temperature_decic": [300, 300, 300],
          }
          request = urllib.request.Request(
              f"http://ev-ai-inference-api.fastapi.svc.cluster.local/api/v1/twins/vehicles/{vehicle_id}/samples",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"backend-namespace FastAPI smoke failed: HTTP {exc.code}: {body}"
              ) from exc
          except Exception as exc:
              raise RuntimeError(f"backend-namespace FastAPI call failed: {exc}") from exc
          if (
              result["final_risk_level"] != 0
              or result.get("anomaly_id") is not None
              or result.get("twin_ai_status") != "ready"
          ):
              raise RuntimeError(f"unexpected smoke response: {result}")
          print("Backend namespace FastAPI service smoke test passed")
          PY
          )"
          kubectl run fastapi-service-smoke -n backend --rm --attach --restart=Never \
            --image=python:3.11-alpine --command -- sh -c "printf '%s' '$SMOKE_SCRIPT_B64' | base64 -d | python -"
